services:
  # El "portero" que recibe las visitas
  nginx-proxy:
    image: nginx:stable-alpine
    container_name: simex-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

  # Tu aplicación de Vue
  frontend:
    build:
      context: ./frontend
      dockerfile: DOCKERFILE
      args:
        VITE_LARAVEL_API: http://localhost:8000/api
        VITE_NET_API: http://localhost:5000/api/
    image: ddelacortep/simex-daw:frontend
    container_name: simex-frontend
    restart: always
    ports:
      - "3000:80"

  # Tu aplicación de Laravel
  backend:
    build:
      context: ./backend
      dockerfile: DOCKERFILE
    image: ddelacortep/simex-daw:backend
    container_name: simex-backend
    restart: always
    ports:
      - "8000:80"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false