user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on; # envia archivos des del kernel
    tcp_nopush on; # espera a tener suficiente data para enviar un paquete completo
    tcp_nodelay on; # envía los datos tan pronto como estén disponibles --> para comandos urgentes 
    keepalive_timeout 65; # tiempo que el servidor mantiene la conexión abierta después de enviar una respuesta
    types_hash_max_size 2048; # tamaño máximo de la tabla hash para los tipos MIME
    client_max_body_size 20M; # tamaño máximo permitido para el cuerpo de la solicitud, útil para limitar el tamaño de los archivos que se pueden subirque 

    gzip on;  # activa la compresión gzip
    gzip_vary on; # agrega el encabezado Vary: Accept-Encoding a las respuestas comprimidas para que los proxies y los navegadores puedan almacenar en caché correctamente las versiones comprimidas y no comprimidas de los recursos
    gzip_proxied any; # habilita la compresión para solicitudes que provienen de proxies, independientemente de las condiciones del proxy
    gzip_comp_level 6; # establece el nivel de compresión gzip (1-9), 1 la peor y mas rapida, 9 la mejor pero mas lenta
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
        # tipos de archivos que se comprimirán con gzip, incluyendo tipos comunes de texto, fuentes y SVG
    include /etc/nginx/conf.d/*.conf;
}


;1. Define comportamiento global del servidor

;  - worker_processes, worker_connections, keepalive_timeout controlan concurrencia y estabilidad.

;  2. Sirve tipos MIME correctos

;  - include /etc/nginx/mime.types; evita que CSS/JS/imagenes se envíen con tipo incorrecto.

;  3. Logging útil para debug y operación

;  - access_log, error_log, log_format te dan trazabilidad de requests y errores.

;  4. Rendimiento de I/O y red

;  - sendfile, tcp_nopush, tcp_nodelay optimizan envío de archivos/respuestas.

;  5. Límite de tamaño de request

;  - client_max_body_size 20M evita rechazos al subir archivos medianos (si no, 413 Request Entity Too Large).

;  6. Compresión gzip

;  - reduce tamaño de respuestas de texto (JSON/CSS/JS), mejora tiempos de carga y uso de ancho de banda.

;  7. Carga configuración por virtual host

;  - include /etc/nginx/conf.d/*.conf; ermite separar la config del sitio (por ejemplo default.conf) sin meter todo en un solo archivo. 