server {
    listen 80;
    server_name localhost;

    # Resolver DNS interno de Docker (necesario para proxy_pass con variables)
    resolver 127.0.0.11 valid=30s;

    # 0. Proxy al chatbot (n8n) — red Docker externa 'simex-net'
    location /chat-api/ {
        proxy_pass http://n8n:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 1. Endpoints del backend Laravel que el frontend llama SIN prefijo /api
    #    (la imagen prebuilt se compilo con VITE_LARAVEL_API vacia).
    location ~ ^/(me|logout|logistics-operations|commercial-offers|clients|roles|locations|incoterms|ports|container-types)(/|$) {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. /login: POST -> backend (autenticacion), GET -> frontend (ruta SPA)
    location = /login {
        set $login_target http://frontend:80;
        if ($request_method = POST) {
            set $login_target http://backend:80;
        }
        proxy_pass $login_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Rutas clasicas del backend (/api, /storage, /sanctum, /telescope)
    location ~ ^/(api|storage|sanctum|telescope) {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Todo lo demas: frontend Vue
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
