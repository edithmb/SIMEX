server {
    listen 80;
    server_name localhost;

    # 0. Proxy al chatbot (n8n) — red Docker externa 'simex-net'
    location /chat-api/ {
        proxy_pass http://n8n:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 1. Configuración para el Frontend (Vue)
    # Todo lo que no coincida con las reglas de abajo, va aquí.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Configuración para el Backend (Laravel)
    # Redirigimos las rutas típicas de una API y carpetas de Laravel.
    location ~ ^/(api|storage|sanctum|telescope) {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Opcional: Manejo de errores 
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}