name: Build and Push to Docker Hub

on:
  pull_request:
    branches:
      - main # O "master", asegúrate de que sea el nombre de tu rama principal

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- CONSTRUCCIÓN DEL BACKEND (LARAVEL) ---
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./SIMEXWeb/backend
          push: true
          tags: |
            ddelacortep/simex-daw:backend
            ddelacortep/simex-daw:backend-latest

      # --- CONSTRUCCIÓN DEL FRONTEND (VUE) ---
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: /SIMEXWeb/frontend
          push: true
          tags: |
            ddelacortep/simex-daw:frontend
            ddelacortep/simex-daw:frontend-latest