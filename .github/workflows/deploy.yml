name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - 'SIMEXWeb/**'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SIMEXWeb/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: SIMEXWeb/backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('SIMEXWeb/backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SIMEXWeb/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SIMEXWeb/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- CONSTRUCCIÓN DEL BACKEND (LARAVEL) ---
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./SIMEXWeb/backend
          file: ./SIMEXWeb/backend/DOCKERFILE
          push: true
          tags: |
            ddelacortep/simex-daw:backend
            ddelacortep/simex-daw:backend-latest

      # --- CONSTRUCCIÓN DEL FRONTEND (VUE) ---
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./SIMEXWeb/frontend
          file: ./SIMEXWeb/frontend/DOCKERFILE
          push: true
          tags: |
            ddelacortep/simex-daw:frontend
            ddelacortep/simex-daw:frontend-latest
